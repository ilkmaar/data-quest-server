# Example Schema Additions
type CreatureState {
  creatureId: String!
  creatureName: String!
  health: Float
  mood: Float
  social: Float
  updatedAt: String!
}

type WorldDayAverages {
  dayNumber: Int!
  avgHealth: Float
  avgMood: Float
  avgSocial: Float
}

type PlotHealth {
  plotId: String!
  growthLevel: Float
  lightLevel: Float
  shadowLevel: Float
  stabilityLevel: Float
  updatedAt: String!
}


# Example Schema Additions
type PlotStatus {
  plotId: String!
  growthLevel: Float!
  lightLevel: Float!
  shadowLevel: Float!
  stabilityLevel: Float!
  x: Float
  y: Float
  updatedAt: String!
}

type CreatureLocation {
  creatureId: String!
  creatureName: String!
  x: Float
  y: Float
  updatedAt: String!
}

type PlayerLocation {
  playerId: String!
  playerName: String!
  x: Float
  y: Float
  updatedAt: String!
}