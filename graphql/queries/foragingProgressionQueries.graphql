type Query {
  playerForagingProgression(playerId: Int!, worldId: String!): PlayerForagingProgression!
  foragingLevelDetails(playerId: Int!, , worldId: String!, levelId: Int!): ForagingLevelDetails!
}

type PlayerForagingProgression {
  currentLevel: Int!
  totalLevels: Int!
  levels: [ForagingLevel!]!
  details: ProgressData!
}

type ForagingLevel {
  id: Int!
  name: String!
  description: String!
  threshold: Int!
  completed: Boolean!
  progress: Float!
}

type ProgressData {
  # Adapt these fields as needed
  # Example:
  resourcesByCategory: [CategoryResources!]
  resourcesByVariety: [VarietyResources!]
  resourcesByIsland: [IslandResources!]
  resourceQualities: [ResourceQuality!]
  allResources: [Int!]
  uniqueResourceTypes: [UniqueResourceType!]
  typeQualities: [TypeQuality!]
}

type ForagingLevelDetails {
  id: Int!
  name: String!
  description: String!
  threshold: Int!
  completed: Boolean!
  progress: Float!
  detailedProgress: DetailedProgressData!
}

type CategoryResources {
  categoryId: Int!
  resourceIds: [Int!]!
}

type VarietyResources {
  varietyId: Int!
  resourceIds: [Int!]!
}

type IslandResources {
  islandId: Int!
  resourceIds: [Int!]!
}

type ResourceQuality {
  resourceId: Int!
  quality: Int!
}

type UniqueResourceType {
  categoryId: Int!
  varietyId: Int!
}

type TypeQuality {
  categoryId: Int!
  varietyId: Int!
  quality: Int!
}

type DetailedProgressData {
  # For example, for level 1:
  resourcesFound: Int
  # Add other fields depending on the level’s details
}


######

type ForagingProgressionDetails {
  totalResourcesFound: Int!
  uniqueResourcesFound: Int!
  highestQualityAchieved: Int!
  averageQuality: Float!
  categoryCompletionCounts: [CategoryCount!]!
  varietyCompletionCounts: [VarietyCount!]!
  islandCompletionCounts: [IslandCount!]!
}

type CategoryCount {
  categoryId: String!
  categoryName: String!
  count: Int!
}

type VarietyCount {
  varietyId: String!
  varietyName: String!
  count: Int!
}

type IslandCount {
  islandId: String!
  islandName: String!
  count: Int!
}